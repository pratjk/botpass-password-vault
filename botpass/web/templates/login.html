<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOTPASS // LOGIN</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%2300ff00'>V</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <div class="login-container hud-brackets">
        <h1>OVERWATCH // VAULT</h1>
        <p class="subtitle" style="font-family: var(--font-mono); color: var(--text-dim); text-transform: uppercase;">SECURE LOCAL STORAGE</p>
        
        {% if error %}
        <div class="alert error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% if needs_setup %}
            <p style="font-family: var(--font-mono); color: var(--accent);">[ SYSTEM: INITIALIZATION REQUIRED ]</p>
            <div class="form-group">
                <input type="password" name="master_pw" placeholder="NEW MASTER PASSWORD" required autofocus>
            </div>
            <div class="form-group">
                <input type="password" name="master_pw2" placeholder="VERIFY PASSWORD" required>
            </div>
            <button type="submit" class="btn btn-primary">[ INITIALIZE ]</button>
            <p class="warning" style="color: var(--danger); font-family: var(--font-mono); margin-top: 16px;">WARNING: NO RECOVERY MECHANISM.</p>
            {% else %}
            <div class="form-group">
                <input type="password" name="master_pw" placeholder="MASTER PASSWORD" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary">[ UNLOCK ]</button>
            {% endif %}
        </form>
    </div>
</body>
</html>
